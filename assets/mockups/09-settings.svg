<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="34" flood-color="#000000" flood-opacity="0.55"/></filter>
  </defs>
  <!-- dimmed workbench backdrop -->
  <rect width="760" height="560" fill="#050506"/>
  <rect width="760" height="560" fill="#000000" fill-opacity="0.5"/>

  <!-- modal card -->
  <g filter="url(#cardshadow)">
    <rect x="160" y="86" width="440" height="388" rx="14" fill="#0c0c0f" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <!-- header -->
  <text x="184" y="124" font-size="16" font-weight="640" letter-spacing="-0.01em" fill="#f5f5f7">Settings</text>
  <g stroke="#f5f5f7" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round"><path d="M566 112 l12 12 M578 112 l-12 12"/></g>

  <!-- provider field -->
  <text x="184" y="166" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#f5f5f7" fill-opacity="0.34">MODEL PROVIDER</text>
  <rect x="184" y="178" width="180" height="34" rx="9" fill="#08080a" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="198" y="200" font-size="12.5" fill="#f5f5f7">Local (llama.cpp)</text>
  <path d="M346 192 l6 6 l6 -6" fill="none" stroke="#f5f5f7" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="376" y="178" width="180" height="34" rx="9" fill="#08080a" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="390" y="200" font-size="12.5" fill="#f5f5f7" fill-opacity="0.4">DeepSeek API</text>

  <!-- model field -->
  <text x="184" y="244" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#f5f5f7" fill-opacity="0.34">MODEL</text>
  <rect x="184" y="256" width="372" height="34" rx="9" fill="#08080a" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="198" y="278" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#f5f5f7" fill-opacity="0.85">mythos-nano.Q4_K_M.gguf</text>

  <!-- python interpreter -->
  <text x="184" y="322" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#f5f5f7" fill-opacity="0.34">PYTHON INTERPRETER</text>
  <rect x="184" y="334" width="372" height="34" rx="9" fill="#08080a" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="198" y="356" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#f5f5f7" fill-opacity="0.7">/Library/Frameworks/Python.framework/3.14</text>
  <!-- detected pill -->
  <circle cx="196" cy="392" r="3.5" fill="#4ade80"/>
  <text x="208" y="396" font-size="11.5" fill="#4ade80">detected · Python 3.14, torch + pandas ready</text>

  <!-- footer buttons -->
  <rect x="404" y="424" width="74" height="32" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="441" y="445" text-anchor="middle" font-size="12.5" fill="#f5f5f7" fill-opacity="0.7">Cancel</text>
  <rect x="488" y="424" width="68" height="32" rx="9" fill="#f5f5f7"/>
  <text x="522" y="445" text-anchor="middle" font-size="12.5" font-weight="600" fill="#08080a">Done</text>

  <text x="20" y="540" font-size="11" fill="#f5f5f7" fill-opacity="0.30">Settings overlay (#settings-overlay) — model provider, interpreter detection</text>
</svg>
