<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="600" fill="#050506"/>

  <!-- tab + toolbar bar -->
  <rect width="900" height="46" fill="#0a0a0c"/>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="14" y="9" width="92" height="28" rx="8" fill="#16161a" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="60" y="28" text-anchor="middle" font-size="12.5" fill="#f5f5f7">main.py</text>
  <circle cx="95" cy="23" r="3" fill="#f5f5f7" fill-opacity="0.55"/>
  <!-- toolbar buttons (right) -->
  <g font-size="12" text-anchor="middle">
    <text x="600" y="28" fill="#f5f5f7" fill-opacity="0.6">Edit Selection</text>
    <text x="688" y="28" fill="#f5f5f7" fill-opacity="0.6">Compile</text>
    <rect x="726" y="10" width="52" height="26" rx="8" fill="#f5f5f7"/>
    <text x="752" y="27" fill="#08080a" font-weight="600">Run</text>
    <text x="806" y="28" fill="#f87171" fill-opacity="0.85">Stop</text>
    <text x="862" y="28" fill="#f5f5f7" fill-opacity="0.6">Save</text>
  </g>

  <!-- gutter -->
  <rect x="0" y="46" width="54" height="554" fill="#070709"/>
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13">
    <g fill="#f5f5f7" fill-opacity="0.28" text-anchor="end">
      <text x="44" y="82">1</text><text x="44" y="104">2</text><text x="44" y="126">3</text><text x="44" y="148">4</text>
      <text x="44" y="170">5</text><text x="44" y="192">6</text><text x="44" y="214">7</text><text x="44" y="236">8</text>
      <text x="44" y="258">9</text><text x="44" y="280">10</text><text x="44" y="302">11</text><text x="44" y="324">12</text>
      <text x="44" y="346">13</text><text x="44" y="368">14</text><text x="44" y="390">15</text><text x="44" y="412">16</text>
      <text x="44" y="434">17</text><text x="44" y="456">18</text>
    </g>
    <g xml:space="preserve" fill="#d6d6db">
      <text x="68" y="82"><tspan fill="#c792ea">import</tspan> torch</text>
      <text x="68" y="104"><tspan fill="#c792ea">import</tspan> torch.nn <tspan fill="#c792ea">as</tspan> nn</text>
      <text x="68" y="126"><tspan fill="#c792ea">import</tspan> pandas <tspan fill="#c792ea">as</tspan> pd</text>
      <text x="68" y="170" fill="#6b7280"># load real data, move it to the active device</text>
      <text x="68" y="192"><tspan fill="#c792ea">def</tspan> <tspan fill="#82aaff">load_data</tspan>(url, device):</text>
      <text x="68" y="214">    df = pd.<tspan fill="#82aaff">read_csv</tspan>(url)</text>
      <text x="68" y="236">    x = torch.<tspan fill="#82aaff">tensor</tspan>(df.values, dtype=torch.float32)</text>
      <text x="68" y="258">    <tspan fill="#c792ea">return</tspan> x.to(device)</text>
      <text x="68" y="302"><tspan fill="#c792ea">class</tspan> <tspan fill="#ffcb6b">MLP</tspan>(nn.Module):</text>
      <text x="68" y="324">    <tspan fill="#c792ea">def</tspan> <tspan fill="#82aaff">__init__</tspan>(self, d_in, h=<tspan fill="#f78c6c">64</tspan>):</text>
      <text x="68" y="346">        <tspan fill="#c792ea">super</tspan>().__init__()</text>
      <text x="68" y="368">        self.net = nn.<tspan fill="#82aaff">Sequential</tspan>(</text>
      <text x="68" y="390">            nn.<tspan fill="#82aaff">Linear</tspan>(d_in, h),</text>
      <text x="68" y="412">            nn.<tspan fill="#82aaff">ReLU</tspan>(),</text>
      <text x="68" y="434">            nn.<tspan fill="#82aaff">Linear</tspan>(h, <tspan fill="#f78c6c">1</tspan>),</text>
      <text x="68" y="456">        )</text>
    </g>
  </g>
  <!-- caret line -->
  <rect x="54" y="246" width="846" height="22" fill="#ffffff" fill-opacity="0.03"/>

  <text x="64" y="582" font-size="11" fill="#f5f5f7" fill-opacity="0.30">Code editor (#editor-region) — Monaco editor with tab bar and run/compile toolbar</text>
</svg>
