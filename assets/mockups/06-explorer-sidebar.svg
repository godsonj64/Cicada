<svg xmlns="http://www.w3.org/2000/svg" width="300" height="640" viewBox="0 0 300 640" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <rect width="300" height="640" fill="#050506"/>
  <line x1="299.5" y1="0" x2="299.5" y2="640" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- header -->
  <text x="16" y="34" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#f5f5f7" fill-opacity="0.34">EXPLORER</text>
  <g fill="none" stroke="#f5f5f7" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round">
    <path d="M262 30 h12 M268 24 v12"/>
    <rect x="282" y="23" width="11" height="13" rx="2" stroke-opacity="0.34"/>
  </g>
  <line x1="0" y1="50" x2="300" y2="50" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- tree rows -->
  <g font-size="13" letter-spacing="-0.01em">
    <!-- models (dir, open) -->
    <text x="16" y="78" fill="#f5f5f7" fill-opacity="0.5">▾</text>
    <text x="34" y="78" fill="#f5f5f7" fill-opacity="0.82">models</text>

    <text x="36" y="104" fill="#f5f5f7" fill-opacity="0.34">·</text>
    <text x="52" y="104" fill="#f5f5f7" fill-opacity="0.7">net.py</text>

    <!-- active file -->
    <rect x="6" y="114" width="288" height="26" rx="7" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="6" y="114" width="2.5" height="26" rx="1.25" fill="#f5f5f7" fill-opacity="0.8"/>
    <text x="36" y="131" fill="#f5f5f7" fill-opacity="0.34">·</text>
    <text x="52" y="131" fill="#f5f5f7" font-weight="500">train.py</text>
    <text x="280" y="131" text-anchor="middle" font-size="14" fill="#f5f5f7" fill-opacity="0.4">×</text>

    <text x="36" y="157" fill="#f5f5f7" fill-opacity="0.34">·</text>
    <text x="52" y="157" fill="#f5f5f7" fill-opacity="0.7">data.csv</text>

    <!-- top-level files -->
    <text x="18" y="187" fill="#f5f5f7" fill-opacity="0.34">·</text>
    <text x="34" y="187" fill="#f5f5f7" fill-opacity="0.82">main.py</text>

    <text x="18" y="213" fill="#f5f5f7" fill-opacity="0.34">·</text>
    <text x="34" y="213" fill="#f5f5f7" fill-opacity="0.82">README.md</text>

    <!-- collapsed dir -->
    <text x="16" y="239" fill="#f5f5f7" fill-opacity="0.5">▸</text>
    <text x="34" y="239" fill="#f5f5f7" fill-opacity="0.82">data</text>

    <text x="16" y="265" fill="#f5f5f7" fill-opacity="0.5">▸</text>
    <text x="34" y="265" fill="#f5f5f7" fill-opacity="0.82">outputs</text>
  </g>

  <text x="16" y="624" font-size="11" fill="#f5f5f7" fill-opacity="0.30">File explorer (#filetree-panel)</text>
</svg>
