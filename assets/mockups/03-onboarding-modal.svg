<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <clipPath id="card"><rect x="80" y="80" width="960" height="520" rx="18"/></clipPath>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050506" stop-opacity="0.96"/>
      <stop offset="40%" stop-color="#050506" stop-opacity="0.74"/>
      <stop offset="72%" stop-color="#050506" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="navfade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#050506" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="46" flood-color="#000000" flood-opacity="0.6"/></filter>
  </defs>

  <rect width="1120" height="680" fill="#050506"/>
  <rect width="1120" height="680" fill="#000000" fill-opacity="0.45"/>

  <rect x="80" y="80" width="960" height="520" rx="18" fill="#0c0c0f" filter="url(#cardshadow)"/>
  <g clip-path="url(#card)">
    <image href="../cicada-onboarding.png" x="80" y="80" width="960" height="520" preserveAspectRatio="xMidYMid slice"/>
    <rect x="80" y="80" width="960" height="520" fill="url(#scrim)"/>
    <rect x="80" y="500" width="960" height="100" fill="url(#navfade)"/>
  </g>

  <!-- text column -->
  <text x="120" y="208" font-size="11" font-weight="600" letter-spacing="1.8" fill="#95e3ff">FOR NON-CODERS &amp; BEGINNERS</text>
  <text x="118" y="252" font-size="36" font-weight="660" letter-spacing="-0.022em" fill="#f5f5f7">Describe it.</text>
  <text x="118" y="296" font-size="36" font-weight="660" letter-spacing="-0.022em" fill="#f5f5f7">Cicada builds it.</text>
  <g font-size="14.5" fill="#f5f5f7" fill-opacity="0.78">
    <text x="120" y="338">Write what you want in plain English. Cicada plans,</text>
    <text x="120" y="362">writes, runs, and fixes the Python for you through a</text>
    <text x="120" y="386">six-stage agentic pipeline — no setup, no boilerplate.</text>
  </g>
  <!-- tags -->
  <g font-size="11" font-weight="540" fill="#f5f5f7" fill-opacity="0.62">
    <rect x="120" y="412" width="68" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="154" y="429" text-anchor="middle">Evaluate</text>
    <rect x="196" y="412" width="60" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="226" y="429" text-anchor="middle">Design</text>
    <rect x="264" y="412" width="72" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="300" y="429" text-anchor="middle">Generate</text>
    <rect x="344" y="412" width="60" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="374" y="429" text-anchor="middle">Review</text>
    <rect x="412" y="412" width="44" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="434" y="429" text-anchor="middle">Fix</text>
    <rect x="464" y="412" width="46" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/><text x="487" y="429" text-anchor="middle">Run</text>
  </g>

  <!-- close -->
  <circle cx="1006" cy="116" r="15" fill="#16161a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14"/>
  <path d="M1000 110l12 12M1012 110l-12 12" stroke="#f5f5f7" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>

  <!-- bottom nav -->
  <g>
    <circle cx="124" cy="566" r="3" fill="#f5f5f7" fill-opacity="0.3"/>
    <rect x="134" y="563" width="22" height="6" rx="3" fill="#f5f5f7"/>
    <circle cx="170" cy="566" r="3" fill="#f5f5f7" fill-opacity="0.3"/>
    <circle cx="186" cy="566" r="3" fill="#f5f5f7" fill-opacity="0.3"/>
    <circle cx="202" cy="566" r="3" fill="#f5f5f7" fill-opacity="0.3"/>
  </g>
  <g font-size="12.5">
    <text x="812" y="571" fill="#f5f5f7" fill-opacity="0.6">Skip tour</text>
    <text x="886" y="571" fill="#f5f5f7" fill-opacity="0.6">Back</text>
    <rect x="932" y="552" width="76" height="30" rx="9" fill="#f5f5f7"/>
    <text x="962" y="571" fill="#08080a" font-weight="600">Next</text>
    <path d="M988 562l6 5-6 5" fill="none" stroke="#08080a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="80" y="636" font-size="12" fill="#f5f5f7" fill-opacity="0.34">Onboarding / welcome modal (#onboard-overlay) — cicada artwork, paged tour, dots + nav</text>
</svg>
